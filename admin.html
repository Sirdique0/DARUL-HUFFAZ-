<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place AI - Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: #1e293b; border-right: 1px solid #334155; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar h2 { color: #38bdf8; font-size: 1.2rem; margin-bottom: 1rem; }
        .sidebar a { color: #f8fafc; text-decoration: none; padding: 0.5rem; border-radius: 4px; cursor: pointer; }
        .sidebar a:hover, .sidebar a.active { background: #334155; }
        .main-content { flex-grow: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 2rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; }
        .card h3 { margin-bottom: 1rem; color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; border-bottom: 1px solid #334155; text-align: left; font-size: 0.9rem; }
        th { background: #0f172a; }
        .btn { padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .btn-danger { background: #f87171; color: #fff; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        textarea, input { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a class="active">Dashboard</a>
        <a onclick="logout()" style="color: #f87171; margin-top: auto;">🚪 Logout</a>
    </div>

    <div class="main-content">
        <!-- Analytics Card -->
        <div class="card">
            <h3>Kididdiga (Analytics)</h3>
            <p>Adadin Masu Amfani (Users): <span id="userCount">0</span></p>
        </div>

        <!-- Base Instructions Card -->
        <div class="card">
            <h3>Base Instructions (System Prompt)</h3>
            <textarea id="baseInstructionsInput" rows="4" placeholder="Rubuta umarnin bot anan..."></textarea>
            <button class="btn btn-primary" onclick="saveBaseInstructions()">Ajiye Canji (Save)</button>
        </div>

        <!-- Broadcast Notice Card -->
        <div class="card">
            <h3>Aika Sanarwa (Broadcast / Notice)</h3>
            <input type="text" id="targetUser" placeholder="Imel ɗin mutum ɗaya (Ka bar shi a bude idan na kowa ne)">
            <textarea id="noticeText" rows="3" placeholder="Rubuta sanarwa anan..."></textarea>
            <button class="btn btn-primary" onclick="sendNotice()">Aika Sanarwa</button>
        </div>

        <!-- Users Management Card -->
        <div class="card">
            <h3>Gudanar da Masu Amfani (All Users)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Imel (Email)</th>
                        <th>Matsayi (Status)</th>
                        <th>Ayyuka (Actions)</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Nan za a cika bayanan users -->
                </tbody>
            </table>
        </div>

        <!-- Appeal Requests Card -->
        <div class="card">
            <h3>Roƙon Afuwa (Suspension Appeals)</h3>
            <div id="appealsList">
                <p style="font-size: 0.9rem; opacity: 0.7;">Babu roƙo a yanzu.</p>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = "abubakarsadeeq8533@gmail.com";
        
        // Tabbatar cewa Admin ne kadai ke shiga
        const currentUser = localStorage.getItem('current_user_email');
        if (currentUser !== ADMIN_EMAIL) {
            alert("Ba ka da izinin shiga wannan shafin!");
            window.location.href = 'index.html';
        }

        // Loda bayanai a shafin Admin
        window.addEventListener('DOMContentLoaded', () => {
            loadAnalytics();
            loadBaseInstructions();
            loadUsers();
            loadAppeals();
        });

        function loadAnalytics() {
            const users = JSON.parse(localStorage.getItem('all_users_list') || '["abubakarsadeeq8533@gmail.com"]');
            document.getElementById('userCount').innerText = users.length;
        }

        function loadBaseInstructions() {
            const saved = localStorage.getItem('chatbot_base_instructions') || '';
            document.getElementById('baseInstructionsInput').value = saved;
        }

        function saveBaseInstructions() {
            const val = document.getElementById('baseInstructionsInput').value;
            localStorage.setItem('chatbot_base_instructions', val);
            alert("An ajiye Base Instructions cikin nasara!");
        }

        function loadUsers() {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            
            // Misali muna amfani da jerin users da aka adana ko kuma wanda ya yi login
            let users = JSON.parse(localStorage.getItem('all_users_list') || '["abubakarsadeeq8533@gmail.com", "customer@gmail.com"]');
            let suspendedUsers = JSON.parse(localStorage.getItem('suspended_users') || '[]');

            users.forEach(email => {
                const isSuspended = suspendedUsers.includes(email);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${email}</td>
                    <td>${isSuspended ? '<span style="color:#f87171;">Suspended</span>' : '<span style="color:#34d399;">Active</span>'}</td>
                    <td>
                        ${isSuspended ? 
                            `<button class="btn btn-primary" onclick="unsuspendUser('${email}')">Dage Dakatarwa</button>` : 
                            `<button class="btn btn-danger" onclick="suspendUser('${email}')">Dakatar (Suspend)</button>`
                        }
                        <button class="btn btn-danger" onclick="forceLogout('${email}')" style="margin-left: 5px;">Force Logout</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function suspendUser(email) {
            let suspended = JSON.parse(localStorage.getItem('suspended_users') || '[]');
            if (!suspended.includes(email)) {
                suspended.push(email);
                localStorage.setItem('suspended_users', JSON.stringify(suspended));
                loadUsers();
            }
        }

        function unsuspendUser(email) {
            let suspended = JSON.parse(localStorage.getItem('suspended_users') || '[]');
            suspended = suspended.filter(e => e !== email);
            localStorage.setItem('suspended_users', JSON.stringify(suspended));
            // Cire appeal idan akwai
            let appeals = JSON.parse(localStorage.getItem('suspension_appeals') || '{}');
            delete appeals[email];
            localStorage.setItem('suspension_appeals', JSON.stringify(appeals));
            loadUsers();
            loadAppeals();
        }

        function forceLogout(email) {
            alert(`An tilasta wa ${email} fita daga manhajar.`);
            // A aikace ana iya share session dinsa
        }

        function sendNotice() {
            const target = document.getElementById('targetUser').value.trim();
            const text = document.getElementById('noticeText').value.trim();
            if (!text) return;

            if (target) {
                // Turawa mutum daya
                let notices = JSON.parse(localStorage.getItem(`notifications_${target}`) || '[]');
                notices.push(text);
                localStorage.setItem(`notifications_${target}`, JSON.stringify(notices));
                alert(`An tura sanarwa zuwa ga ${target}`);
            } else {
                // Turawa kowa (Broadcast)
                let notices = JSON.parse(localStorage.getItem('user_notifications') || '[]');
                notices.push(text);
                localStorage.setItem('user_notifications', JSON.stringify(notices));
                alert("An tura sanarwa zuwa ga dukkan masu amfani!");
            }
            document.getElementById('noticeText').value = '';
            document.getElementById('targetUser').value = '';
        }

        function loadAppeals() {
            const container = document.getElementById('appealsList');
            const appeals = JSON.parse(localStorage.getItem('suspension_appeals') || '{}');
            const keys = Object.keys(appeals);

            if (keys.length === 0) {
                container.innerHTML = '<p style="font-size: 0.9rem; opacity: 0.7;">Babu roƙo a yanzu.</p>';
                return;
            }

            container.innerHTML = '';
            keys.forEach(email => {
                const div = document.createElement('div');
                div.style.cssText = "background:#0f172a; padding:10px; margin-bottom:10px; border-radius:4px;";
                div.innerHTML = `
                    <strong>${email}:</strong> ${appeals[email]}
                    <br><button class="btn btn-primary" style="margin-top:5px;" onclick="unsuspendUser('${email}')">Yarda (Ajiye Dakatarwa)</button>
                `;
                container.appendChild(div);
            });
        }

        function logout() {
            localStorage.removeItem('current_user_email');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
